[project]
name = "keguan-mvp"
version = "0.1.0"
description = "科研项目全生命周期管理系统 MVP"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104,<1",
    "uvicorn[standard]>=0.24,<1",
    "sqlalchemy>=2.0,<3",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.6,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.25,<1",
    "pytest>=7.4,<9",
    "ruff>=0.1,<1",
    "mypy>=1.7,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
